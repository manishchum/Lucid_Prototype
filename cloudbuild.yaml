steps:
  # 0. Pull the previous latest image to use as Docker build cache
  - name: 'gcr.io/cloud-builders/docker'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        docker pull asia-south2-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/lucid_prototype:latest || exit 0

  # 1. Build the container image using --cache-from
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '--cache-from'
      - 'asia-south2-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/lucid_prototype:latest'
      - '-t'
      - 'asia-south2-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/lucid_prototype:$COMMIT_SHA'
      - '-t'
      - 'asia-south2-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/lucid_prototype:latest'
      - '-f'
      - 'Dockerfile'
      - '.'

  # 2. Push images to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'asia-south2-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/lucid_prototype:$COMMIT_SHA'

  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'asia-south2-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/lucid_prototype:latest'

  # 3. Deploy container image to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'lucid-prototype-staging'
      - '--image'
      - 'asia-south2-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/lucid_prototype:$COMMIT_SHA'
      - '--region'
      - 'asia-south2'
      - '--platform'
      - 'managed'

images:
  - 'asia-south2-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/lucid_prototype:$COMMIT_SHA'
  - 'asia-south2-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/lucid_prototype:latest'

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: 'E2_HIGHCPU_8'
