<!DOCTYPE html>
<html>
<head>
    <title>CORS Test</title>
</head>
<body>
    <h1>CORS Test - Schedule Email</h1>
    <button onclick="testCORS()">Click to Test CORS</button>
    <pre id="result">Waiting for test...</pre>
    
    <script>
        async function testCORS() {
            try {
                // console.log("Sending request to http://127.0.0.1:8000/api/dispatch/schedule-email");
                const response = await fetch('http://127.0.0.1:8000/api/dispatch/schedule-email', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-User-ID': 'test-user-123'
                    },
                    body: JSON.stringify({
                        module_id: "test-module",
                        subject: "Test Email",
                        body: "<p>Test body</p>",
                        scheduled_date: "2026-03-25",
                        scheduled_time: "10:00"
                    })
                });
                
                const data = await response.json();
                document.getElementById('result').innerText = "✅ CORS SUCCESS!\n\n" + JSON.stringify(data, null, 2);
            } catch (error) {
                document.getElementById('result').innerText = "❌ CORS FAILED!\n\n" + error.toString();
            }
        }
    </script>
</body>
</html>
