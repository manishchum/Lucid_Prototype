name: Deploy Workers

permissions:
  contents: read

on:
  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - 'Frontend/worker/**'
      - '.github/workflows/deploy-workers.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:

      - uses: actions/checkout@v4

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.WORKER_VM_SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H ${{ secrets.WORKER_VM_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy
        run: |
          ssh \
            -i ~/.ssh/id_ed25519 \
            -o StrictHostKeyChecking=yes \
            ${{ secrets.WORKER_VM_USER }}@${{ secrets.WORKER_VM_HOST }} \
            "/home/serviceaccount/deploy-workers.sh"
            