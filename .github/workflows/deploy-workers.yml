name: Deploy Workers

permissions:
  contents: read

on:
  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - 'Frontend/worker/**'
      - '.github/workflows/deploy-workers.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:

      - uses: actions/checkout@v4

      
      - name: Diagnose SSH Setup
        shell: bash
        run: |
          set -euxo pipefail
          echo "Runner user: $(id -un)"
          echo "HOME=$HOME"
          id
          ls -ld "$HOME"
          ls -ld "$HOME/.ssh" || true
          mkdir -pv "$HOME/.ssh"
          echo "SSH directory creation succeeded"

        
      - name: Configure SSH
        env:
          WORKER_VM_SSH_PRIVATE_KEY: ${{ secrets.WORKER_VM_SSH_PRIVATE_KEY }}
          WORKER_VM_HOST: ${{ secrets.WORKER_VM_HOST }}
          WORKER_VM_USER: ${{ secrets.WORKER_VM_USER }}
        shell: bash
        run: |
          set -euxo pipefail

          echo "HOME=$HOME"
          id
          ls -ld "$HOME"
          ls -ld "$HOME/.ssh" || true

          mkdir -pv "$HOME/.ssh"
          ls -ld "$HOME/.ssh"

          printf '%s\n' "$WORKER_VM_SSH_PRIVATE_KEY" \
            | tr -d '\r' > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"

          ssh-keygen -y -f "$HOME/.ssh/id_ed25519" >/dev/null

          ssh-keyscan -H "$WORKER_VM_HOST" \
            >> "$HOME/.ssh/known_hosts" 2>&1

          chmod 600 "$HOME/.ssh/known_hosts"

      # - name: Configure SSH
      #   run: |
      #     mkdir -p ~/.ssh
      #     echo "${{ secrets.WORKER_VM_SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
      #     chmod 600 ~/.ssh/id_ed25519
      #     ssh-keyscan -H ${{ secrets.WORKER_VM_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy
        run: |
          ssh \
            -i ~/.ssh/id_ed25519 \
            -o StrictHostKeyChecking=yes \
            ${{ secrets.WORKER_VM_USER }}@${{ secrets.WORKER_VM_HOST }} \
            "/home/serviceaccount/deploy-workers.sh"
            